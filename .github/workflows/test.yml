name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Test
        run: uv run pytest -vv

      # A hand edit to generated code, or a snapshot committed without
      # regenerating from it, fails here.
      - name: Generated code is up to date
        run: |
          uv run scripts/generate_models.py --skip-fetch
          git diff --exit-code src/ena_api/_generated
